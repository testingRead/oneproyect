name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/graybox

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_STATUS: "stable"
  GODOT_BINARY_SHA256: "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
  GODOT_TEMPLATES_SHA256: "86409db6200b6f8fd3230989c2d2002851f3dd18acf11d7bdbafddf5a0dd0f72"

jobs:
  build:
    name: Export debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pinned Godot tools
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/oneproyect-godot
            ~/.local/share/godot/export_templates/4.7.1.stable
          key: godot-linux-4.7.1-stable-v1

      - name: Install pinned Godot editor and templates
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="$HOME/.cache/oneproyect-godot"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          RELEASE="${GODOT_VERSION}-${GODOT_STATUS}"
          BINARY_ZIP="Godot_v${RELEASE}_linux.x86_64.zip"
          TEMPLATE_TPZ="Godot_v${RELEASE}_export_templates.tpz"
          BASE_URL="https://github.com/godotengine/godot-builds/releases/download/${RELEASE}"
          mkdir -p "$DIST_DIR" "$TEMPLATE_DIR"

          if [[ ! -x "$DIST_DIR/godot" ]]; then
            curl --fail --location --retry 3 --output "$DIST_DIR/$BINARY_ZIP" "$BASE_URL/$BINARY_ZIP"
            echo "${GODOT_BINARY_SHA256}  $DIST_DIR/$BINARY_ZIP" | sha256sum --check -
            unzip -q -o "$DIST_DIR/$BINARY_ZIP" -d "$DIST_DIR/unpacked"
            mv "$DIST_DIR/unpacked/Godot_v${RELEASE}_linux.x86_64" "$DIST_DIR/godot"
            chmod +x "$DIST_DIR/godot"
            rm -r "$DIST_DIR/unpacked"
          fi

          if [[ ! -f "$TEMPLATE_DIR/android_debug.apk" ]]; then
            curl --fail --location --retry 3 --output "$DIST_DIR/$TEMPLATE_TPZ" "$BASE_URL/$TEMPLATE_TPZ"
            echo "${GODOT_TEMPLATES_SHA256}  $DIST_DIR/$TEMPLATE_TPZ" | sha256sum --check -
            mkdir -p "$DIST_DIR/templates-unpacked"
            unzip -q -o "$DIST_DIR/$TEMPLATE_TPZ" -d "$DIST_DIR/templates-unpacked"
            cp -a "$DIST_DIR/templates-unpacked/templates/." "$TEMPLATE_DIR/"
            rm -r "$DIST_DIR/templates-unpacked"
          fi

          "$DIST_DIR/godot" --version

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.cache/oneproyect-godot/godot" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Run gameplay smoke test
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$HOME/.cache/oneproyect-godot/godot"
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/smoke_test.gd
          set +e
          timeout 3 "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/oneproyect-boot.log" 2>&1
          boot_code=$?
          set -e
          test "$boot_code" -eq 124
          if grep -qE "SCRIPT ERROR|ERROR:|Parse Error" "$RUNNER_TEMP/oneproyect-boot.log"; then
            cat "$RUNNER_TEMP/oneproyect-boot.log"
            exit 1
          fi

      - name: Verify two-client multiplayer relay
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$HOME/.cache/oneproyect-godot/godot"
          SERVER_LOG="$RUNNER_TEMP/oneproyect-server.log"
          HOST_LOG="$RUNNER_TEMP/oneproyect-host.log"
          OBSERVER_LOG="$RUNNER_TEMP/oneproyect-observer.log"

          "$GODOT" --headless --path "$GITHUB_WORKSPACE" -- --server > "$SERVER_LOG" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if grep -q "ONEPROYECT_SERVER_READY" "$SERVER_LOG"; then
              break
            fi
            sleep 0.25
          done
          grep -q "ONEPROYECT_SERVER_READY" "$SERVER_LOG"

          timeout 15 "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/network_probe.gd -- --role=observer > "$OBSERVER_LOG" 2>&1 &
          observer_pid=$!
          sleep 0.8
          timeout 15 "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --script res://tests/network_probe.gd -- --role=host > "$HOST_LOG" 2>&1 &
          host_pid=$!
          set +e
          wait "$host_pid"
          host_code=$?
          wait "$observer_pid"
          observer_code=$?
          set -e
          if [[ "$host_code" -ne 0 || "$observer_code" -ne 0 ]]; then
            cat "$SERVER_LOG" "$HOST_LOG" "$OBSERVER_LOG"
            exit 1
          fi

          grep -q "NETWORK_PROBE_OK role=host" "$HOST_LOG"
          grep -q "NETWORK_PROBE_OK role=observer" "$OBSERVER_LOG"
          if grep -qE "SCRIPT ERROR|NETWORK_PROBE_FAIL|Invalid packet|ERROR:" \
            "$SERVER_LOG" "$HOST_LOG" "$OBSERVER_LOG"; then
            cat "$SERVER_LOG" "$HOST_LOG" "$OBSERVER_LOG"
            exit 1
          fi

      - name: Prepare stable debug signing
        shell: bash
        env:
          SIGNING_STORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_STORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oneproyect-signing.jks"
          chmod 600 "$RUNNER_TEMP/oneproyect-signing.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/oneproyect-signing.jks" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" > /dev/null

      - name: Export Android debug APKs
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/oneproyect-signing.jks
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/android
          "$HOME/.cache/oneproyect-godot/godot" --headless --path "$GITHUB_WORKSPACE" \
            --export-debug "Android Debug ARM64" build/android/oneproyect-debug-arm64.apk
          "$HOME/.cache/oneproyect-godot/godot" --headless --path "$GITHUB_WORKSPACE" \
            --export-debug "Android Debug ARM32" build/android/oneproyect-debug-arm32.apk
          test -s build/android/oneproyect-debug-arm64.apk
          test -s build/android/oneproyect-debug-arm32.apk
          max_apk_bytes=$((36 * 1024 * 1024))
          test "$(stat -c '%s' build/android/oneproyect-debug-arm64.apk)" -lt "$max_apk_bytes"
          test "$(stat -c '%s' build/android/oneproyect-debug-arm32.apk)" -lt "$max_apk_bytes"
          ls -lh build/android/oneproyect-debug-arm64.apk build/android/oneproyect-debug-arm32.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs \
            build/android/oneproyect-debug-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs \
            build/android/oneproyect-debug-arm32.apk
          (
            cd build/android
            sha256sum oneproyect-debug-arm64.apk > oneproyect-debug-arm64.apk.sha256
            sha256sum oneproyect-debug-arm32.apk > oneproyect-debug-arm32.apk.sha256
          )

      - name: Publish ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneproyect-android-debug-arm64-${{ github.run_number }}
          path: |
            build/android/oneproyect-debug-arm64.apk
            build/android/oneproyect-debug-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Publish ARM32 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneproyect-android-debug-arm32-${{ github.run_number }}
          path: |
            build/android/oneproyect-debug-arm32.apk
            build/android/oneproyect-debug-arm32.apk.sha256
          if-no-files-found: error
          retention-days: 1
